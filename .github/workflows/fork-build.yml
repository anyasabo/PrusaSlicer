# Builds the fork anyasabo/PrusaSlicer (branch anya/main) for macOS arm64 and Linux x86_64.
#
# The steps are the ones of a local build: .github/fork/build.sh runs doc/Build.md, and package-*.sh makes the
# packages. This file adds only the system packages of doc/Build.md, the caches and the upload.
# - A push to anya/main: the packages are workflow artifacts.
# - A tag v<version>-anya.<n>: the packages also go to the GitHub release of the tag (upload-release.sh).
#
# Caches:
# - deps: the dependency prefix (deps/build/destdir). The key has the hash of deps/ and the OS and SDK version. A hit
#   skips doc/Build.md step 1 (more than one hour). It is saved right after the deps build, also if the app fails.
#   A failed deps build is not saved: CMake runs the ExternalProject steps again without the full deps/build tree
#   (tested: the stamp files are not enough, with Ninja and with Make), and the full tree is too large for a cache.
# - ccache: the compiler cache of the app. A new entry each run, restored from the last one.
# - lto: the ThinLTO cache of the linker (build.sh), the same way. A small change then links much faster.
#
# The upstream workflows (build_osx.yml and others) call private Prusa workflows. They are disabled in the fork
# settings (gh workflow disable), so they do not run on the fork.
name: Fork build

on:
  push:
    branches: [anya/main]
    tags: ['v*-anya.*']
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: 3G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # The precompiled headers (SLIC3R_PCH) need these for ccache hits. On clang, build.sh also adds
  # -Xclang -fno-pch-timestamp: without it, each file misses the cache.
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            package: .github/fork/package-macos.sh
            cc: clang
            cxx: clang++
          # The latest LLVM release from apt.llvm.org, the same version as the devspace (devspaces/prusa.sh).
          # The binaries need the glibc of Ubuntu 26.04 or newer.
          - name: linux-x64
            runner: ubuntu-26.04
            package: .github/fork/package-linux.sh
            cc: clang-23
            cxx: clang++-23
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build.sh reads the tag for the version suffix

      # doc/Build.md, "0. Prerequisites", and ccache.
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install automake cmake git gettext libtool texinfo ccache
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-23 main" |
            sudo tee /etc/apt/sources.list.d/llvm-23.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y git build-essential autoconf cmake libtool libglu1-mesa-dev libgtk-3-dev \
            libdbus-1-dev libwebkit2gtk-4.1-dev libhidapi-dev texinfo ccache clang-23 lld-23 llvm-23

      - name: Cache keys
        id: keys
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            os="macos-$(sw_vers -productVersion)-sdk$(xcrun --show-sdk-version)"
          else
            os="$(. /etc/os-release && echo "$ID-$VERSION_ID")"
          fi
          cxx=$("${CXX:-c++}" --version | head -1 | sed 's/[^A-Za-z0-9.]\+/-/g')
          echo "deps=deps-$RUNNER_OS-$RUNNER_ARCH-$os-$cxx-${{ hashFiles('deps/**', 'cmake/modules/**') }}" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-$RUNNER_OS-$RUNNER_ARCH-$os-$cxx" >> "$GITHUB_OUTPUT"
          echo "lto=lto-$RUNNER_OS-$RUNNER_ARCH-$os-$cxx" >> "$GITHUB_OUTPUT"

      - name: Restore the dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/build/destdir
          key: ${{ steps.keys.outputs.deps }}

      - name: Build the dependencies (doc/Build.md step 1)
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/fork/build.sh deps

      - name: Save the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/build/destdir
          key: ${{ steps.keys.outputs.deps }}

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}
          restore-keys: ${{ steps.keys.outputs.ccache }}-

      - name: Restore the ThinLTO cache
        uses: actions/cache/restore@v6
        with:
          path: build/lto-cache
          key: ${{ steps.keys.outputs.lto }}-${{ github.run_id }}
          restore-keys: ${{ steps.keys.outputs.lto }}-

      - name: Build PrusaSlicer (doc/Build.md step 2)
        run: |
          ccache --zero-stats
          .github/fork/build.sh app
          ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}

      - name: Save the ThinLTO cache
        if: always() && hashFiles('build/lto-cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: build/lto-cache
          key: ${{ steps.keys.outputs.lto }}-${{ github.run_id }}

      - name: Package
        run: ${{ matrix.package }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PrusaSlicer-${{ matrix.name }}
          path: build/package/*
          if-no-files-found: error

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/fork/upload-release.sh "${GITHUB_REF_NAME}"

  # A second compiler as a check: GCC 16.2 (Ubuntu 26.10 has it, the 26.04 runner has only a snapshot). Different
  # compilers find different problems (warnings, undefined behaviour). It only compiles: no LTO (CMakeLists.txt turns
  # LTO on for Release only), no debug info, no package, no release. Not on tags.
  gcc-check:
    if: github.ref_type != 'tag'
    name: linux-gcc16-check
    runs-on: ubuntu-26.04
    container: ubuntu:26.10
    timeout-minutes: 360
    env:
      CC: gcc-16
      CXX: g++-16
      CMAKE_ARGS: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2
    steps:
      # doc/Build.md, "0. Prerequisites" (Ubuntu), gcc-16, ccache. git before the checkout, for the tags.
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git build-essential autoconf cmake libtool libglu1-mesa-dev \
            libgtk-3-dev libdbus-1-dev libwebkit2gtk-4.1-dev libhidapi-dev texinfo ccache gcc-16 g++-16 curl ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache keys
        id: keys
        run: |
          os="$(. /etc/os-release && echo "$ID-$VERSION_ID")"
          cxx=$("$CXX" --version | head -1 | sed 's/[^A-Za-z0-9.]\+/-/g')
          echo "deps=deps-check-$os-$cxx-${{ hashFiles('deps/**', 'cmake/modules/**') }}" >> "$GITHUB_OUTPUT"
          echo "ccache=ccache-check-$os-$cxx" >> "$GITHUB_OUTPUT"

      - name: Restore the dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/build/destdir
          key: ${{ steps.keys.outputs.deps }}

      - name: Build the dependencies (doc/Build.md step 1)
        if: steps.deps.outputs.cache-hit != 'true'
        run: .github/fork/build.sh deps

      - name: Save the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/build/destdir
          key: ${{ steps.keys.outputs.deps }}

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}
          restore-keys: ${{ steps.keys.outputs.ccache }}-

      - name: Compile PrusaSlicer with GCC 16
        shell: bash  # -eo pipefail: a failed build must fail the step, also with tee
        run: |
          ccache --zero-stats
          .github/fork/build.sh app 2>&1 | tee build-gcc16.log
          ccache --show-stats
          echo "warnings: $(grep -c 'warning:' build-gcc16.log)"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.keys.outputs.ccache }}-${{ github.run_id }}

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-gcc16
          path: build-gcc16.log
